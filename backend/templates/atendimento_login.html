{% extends "atendimento_base.html" %}

{% block title %}Login | Central de Atendimento{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-16">
    <div class="glass-panel rounded-[2rem] p-10 shadow-[0_40px_120px_-40px_rgba(0,0,0,0.6)]">
        <div class="mb-8 text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-emerald-500/15 text-emerald-300 mb-5 border border-emerald-500/20">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
            </div>
            <h1 class="text-3xl font-black tracking-tight mb-2">Login Central de Atendimento</h1>
            <p class="text-sm text-slate-400">Entre com usuário e senha para acessar o atendimento WhatsApp.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <input type="hidden" name="intent" value="suporte">
            <div>
                <label class="block text-[10px] font-black uppercase tracking-[0.25em] text-slate-500 mb-2">Usuário ou E-mail</label>
                <input type="text" name="login_id" required class="glass-input w-full px-5 py-4 rounded-3xl text-white text-sm font-bold" placeholder="Digite seu usuário ou e-mail">
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase tracking-[0.25em] text-slate-500 mb-2">Senha</label>
                <div class="relative">
                    <input type="password" id="loginPass" name="password" required class="glass-input w-full px-5 py-4 rounded-3xl text-white text-sm font-bold pr-16" placeholder="********">
                    <button type="button" onclick="togglePass('loginPass', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7s-8.268-2.943-9.542-7z"/></svg></button>
                </div>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-slate-800 text-white font-black uppercase text-xs tracking-[0.25em] py-4 rounded-3xl shadow-lg">Acessar Atendimento</button>
            <div id="loginMsg" class="hidden rounded-3xl border px-4 py-3 text-sm font-bold"></div>
        </form>

        <div class="mt-8 text-center text-xs text-slate-500">
            <p>Voltar ao portal geral? <a href="/login" class="text-emerald-400 hover:text-white font-black">Clique aqui</a></p>
        </div>
    </div>
</div>

<script>
    function togglePass(id, btn) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        const msg = document.getElementById('loginMsg');
        msg.classList.add('hidden');
        msg.textContent = '';
        const fd = new FormData(e.target);
        try {
            const resp = await fetch('/api/auth/login', { method: 'POST', body: fd });
            const raw = await resp.text();
            let res;
            try { res = JSON.parse(raw); } catch { res = { success: false, detail: raw || 'Falha no login' }; }
            if (resp.ok && res.success) {
                window.location.href = res.redirect;
                return;
            }
            msg.className = 'text-sm font-bold rounded-3xl border px-4 py-3 bg-rose-500/10 text-rose-300 border-rose-500/20';
            msg.classList.remove('hidden');
            msg.textContent = res.detail || `Falha no login (${resp.status})`;
        } catch (err) {
            msg.className = 'text-sm font-bold rounded-3xl border px-4 py-3 bg-rose-500/10 text-rose-300 border-rose-500/20';
            msg.classList.remove('hidden');
            msg.textContent = 'Não foi possível conectar ao servidor. Verifique e tente novamente.';
        }
    };
</script>
{% endblock %}
