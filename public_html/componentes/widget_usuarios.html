<script>
    async function carregarWidgetUsuarios() {
        try {
            const response = await fetch('/public_html/api/usuarios_widget.php');
            const dados = await response.json();

            const loading = document.getElementById('widget-loading');
            const content = document.getElementById('widget-content');
            const error = document.getElementById('widget-error');

            if (dados.success && dados.data) {
                loading.classList.add('hidden');
                error.classList.add('hidden');
                content.classList.remove('hidden');

                // Atualizar valores
                const total = dados.data.total_maquinas;
                const online = dados.data.maquinas_online;
                const offline = total - online;
                const usuarios = dados.data.usuarios_ativos;
                const pct = dados.data.status_pct;

                document.getElementById('widget-status-text').textContent = `${online}/${total}`;
                document.getElementById('widget-progress').style.width = pct + '%';
                document.getElementById('widget-online').textContent = online;
                document.getElementById('widget-offline').textContent = offline;
                document.getElementById('widget-usuarios').textContent = usuarios;

                // Tempo atualizado
                const dataCaptura = new Date(dados.data.data_captura.replace(/(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2}):(\d{2})/, '$3-$2-$1T$4:$5:$6'));
                const agora = new Date();
                const diff = Math.floor((agora - dataCaptura) / 1000);

                if (diff < 60) {
                    document.getElementById('widget-updated').textContent = 'Atualizado agora';
                } else if (diff < 3600) {
                    document.getElementById('widget-updated').textContent = 'Atualizado há ' + Math.floor(diff / 60) + 'm';
                } else {
                    document.getElementById('widget-updated').textContent = 'Atualizado às ' + dados.data.data_captura.split(' ')[1];
                }
            } else {
                loading.classList.add('hidden');
                content.classList.add('hidden');
                error.classList.remove('hidden');
            }
        } catch (error) {
            console.error('Erro ao carregar widget:', error);
            document.getElementById('widget-loading').classList.add('hidden');
            document.getElementById('widget-content').classList.add('hidden');
            document.getElementById('widget-error').classList.remove('hidden');
        }
    }

    // Carregamento inicial
    carregarWidgetUsuarios();

    // Recarregar a cada 30 segundos
    setInterval(carregarWidgetUsuarios, 30000);
</script>
