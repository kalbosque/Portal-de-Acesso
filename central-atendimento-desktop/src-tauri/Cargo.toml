[package]
name = "central-atendimento-desktop"
version = "0.1.0"
description = "Aplicativo Windows da Central de Atendimento"
authors = ["Atual RNC"]
edition = "2021"

[lib]
name = "central_atendimento_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
