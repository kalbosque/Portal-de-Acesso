[package]
name = "central-atendimento-operador"
version = "0.1.4"
description = "Aplicativo Windows da Central de Atendimento - Operador"
authors = ["Atual RNC"]
edition = "2021"

[lib]
name = "central_atendimento_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
