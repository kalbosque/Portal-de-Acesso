<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Central de Atendimento</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #07131a; }
      .loading { display: grid; place-items: center; height: 100%; color: #a7f3d0; font: 600 14px Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div class="loading">Abrindo a Central de Atendimento...</div>
    <script>
      const server = 'http://192.168.1.230:3001';
      localStorage.setItem('central_atendimento_tauri', '1');
      const target = `${server}/central-atendimento?desktop=1`;
      window.location.replace(target);
    </script>
  </body>
</html>
